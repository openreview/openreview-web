# This workflow deploys any branch or tag to the staging environment.

name: Staging Deployment

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: The branch, tag, or commit hash to deploy
        required: false
        default: master
        type: string

jobs:
  deploy:
    # Allow the job to fetch a GitHub ID token
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    concurrency:
      group: dev-web-deploy
      cancel-in-progress: false

    env:
      TAG: ${{ github.event.inputs.tag }}

    steps:
      - uses: actions/checkout@v6
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: openreview
          repositories: openreview-cloud
      - name: Checkout openreview-cloud
        uses: actions/checkout@v6
        with:
          repository: openreview/openreview-cloud
          path: openreview-cloud
          token: ${{ steps.app-token.outputs.token }}
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          skip_install: true
      - name: Build and deploy to Cloud Run
        run: |
          gcloud builds submit \
            --config openreview-cloud/Terraform/dev/web-cloudrun/build/cloudbuild.yaml \
            --substitutions="^::^_WEB_REF=${TAG}" \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            openreview-cloud/Terraform/dev/web-cloudrun/build
